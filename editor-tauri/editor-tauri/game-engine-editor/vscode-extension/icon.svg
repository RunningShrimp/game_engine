<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f74c00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7a200;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)" />

  <!-- Game controller shape -->
  <g transform="translate(106, 126)">
    <!-- Main body -->
    <rect x="0" y="50" width="300" height="150" rx="30" fill="#1e1e1e" />

    <!-- Left handle -->
    <ellipse cx="50" cy="200" rx="40" ry="50" fill="#1e1e1e" />

    <!-- Right handle -->
    <ellipse cx="250" cy="200" rx="40" ry="50" fill="#1e1e1e" />

    <!-- D-pad -->
    <g transform="translate(70, 115)">
      <rect x="20" y="0" width="20" height="60" fill="#3a3a3a" />
      <rect x="0" y="20" width="60" height="20" fill="#3a3a3a" />
      <circle cx="30" cy="30" r="8" fill="#2a2a2a" />
    </g>

    <!-- Action buttons -->
    <g transform="translate(200, 100)">
      <circle cx="0" cy="0" r="12" fill="#ff6b6b" />
      <circle cx="35" cy="15" r="12" fill="#4ecdc4" />
      <circle cx="35" cy="45" r="12" fill="#ffe66d" />
      <circle cx="0" cy="60" r="12" fill="#95e1d3" />
    </g>

    <!-- Analog sticks -->
    <circle cx="90" cy="160" r="18" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="3" />
    <circle cx="210" cy="160" r="18" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="3" />

    <!-- Center buttons -->
    <rect x="135" y="125" width="30" height="8" rx="4" fill="#3a3a3a" />
    <rect x="135" y="140" width="30" height="8" rx="4" fill="#3a3a3a" />

    <!-- "GE" text -->
    <text x="150" y="100" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#f74c00" text-anchor="middle">GE</text>
  </g>
</svg>
