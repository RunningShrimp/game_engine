[package]
name = "asset-store-cli"
version = "0.1.0"
edition = "2021"
description = "Game Engine Asset Store CLI Tool"
authors = ["Game Engine Team"]

[[bin]]
name = "asset-store"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4.4", features = ["derive"] }

# Error handling
anyhow = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream"] }

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Progress bars
indicatif = "0.17"

# Interactive prompts
dialoguer = "0.11"

# Futures utilities
futures-util = "0.3"
