[package]
name = "game-engine-editor"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# Exclude from parent workspace
[workspace]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "game_engine_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WebGPU and graphics
wgpu = { version = "22", features = ["webgl"] }
bytemuck = { version = "1.16", features = ["derive"] }
futures = "0.3"

# Math and utilities
glam = { version = "0.29", features = ["serde"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# UUID generation
uuid = { version = "1.10", features = ["v4", "serde"] }

# 3D model importers
gltf = { version = "1.4", features = ["extras", "names"] }
fbxcel = { version = "0.7", features = ["tree"] }

# Error handling
thiserror = "1.0"

# Base64 encoding for asset previews
base64 = "0.22"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Plugin system dependencies
libloading = "0.8"
toml = "0.8"
wasmtime = "19"
mlua = { version = "0.9", features = ["lua54", "vendored"] }

