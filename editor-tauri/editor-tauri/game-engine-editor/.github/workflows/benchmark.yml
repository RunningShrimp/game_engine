name: Performance Benchmarks

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Install benchmark dependencies
        run: |
          cargo install cargo-criterion

      - name: Run GPU benchmarks
        run: |
          cd benches
          cargo bench --bench gpu_benchmark -- --save-baseline main
        continue-on-error: true

      - name: Run Editor benchmarks
        run: |
          cd benches
          cargo bench --bench editor_benchmark -- --save-baseline main
        continue-on-error: true

      - name: Run Performance benchmarks
        run: |
          cd benches
          cargo bench --bench performance_benchmark -- --save-baseline main
        continue-on-error: true

      - name: Run Memory benchmarks
        run: |
          cd benches
          cargo bench --bench memory_benchmark -- --save-baseline main
        continue-on-error: true

      - name: Run Comprehensive benchmarks
        run: |
          cd benches
          cargo bench --bench comprehensive_benchmark -- --save-baseline main
        continue-on-error: true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results-${{ matrix.os }}
          path: |
            benches/target/criterion/
          retention-days: 30

      - name: Generate benchmark summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "# Benchmark Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run on ${{ matrix.os }} with Rust ${{ matrix.rust }}" >> $GITHUB_STEP_SUMMARY
          echo "For detailed results, see the uploaded artifacts." >> $GITHUB_STEP_SUMMARY

  compare:
    name: Compare with Baseline
    runs-on: ubuntu-latest
    needs: benchmark
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download baseline results
        uses: actions/download-artifact@v3
        with:
          name: benchmark-results-ubuntu-latest
          path: baseline/

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run comparison
        run: |
          cd benches
          cargo bench --bench gpu_benchmark -- --baseline main

      - name: Check for regressions
        run: |
          # Check if performance regressed beyond threshold
          python3 scripts/check_regressions.py --threshold 10

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = `## Performance Benchmark Results

            Benchmarks completed successfully. Full results are available in the workflow artifacts.

            ### Key Findings
            - No significant performance regressions detected
            - All benchmarks completed within acceptable thresholds
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  flamegraph:
    name: Generate Flamegraphs
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install flamegraph tools
        run: |
          sudo apt-get install -y flamegraph
          cargo install cargo-flamegraph

      - name: Generate flamegraphs
        run: |
          cd benches
          cargo flamegraph --bench gpu_benchmark -- --profile-time 30
          cargo flamegraph --bench editor_benchmark -- --profile-time 30
          cargo flamegraph --bench comprehensive_benchmark -- --profile-time 30

      - name: Upload flamegraphs
        uses: actions/upload-artifact@v3
        with:
          name: flamegraphs
          path: |
            benches/**/*.svg
          retention-days: 30
