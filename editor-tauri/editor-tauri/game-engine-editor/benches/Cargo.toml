[package]
name = "game-engine-benchmarks"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Criterion for benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Core dependencies from main project
game_engine_editor_lib = { path = "../src-tauri" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "22", features = ["webgl"] }
glam = { version = "0.29", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Additional benchmarking utilities
pprof = { version = "0.13", features = ["flamegraph", "criterion"] }
rand = "0.8"
async-channel = "2"

[[bench]]
name = "gpu_benchmark"
harness = false

[[bench]]
name = "editor_benchmark"
harness = false

[[bench]]
name = "performance_benchmark"
harness = false

[[bench]]
name = "memory_benchmark"
harness = false

[[bench]]
name = "comprehensive_benchmark"
harness = false
