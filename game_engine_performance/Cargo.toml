[package]
name = "game_engine_performance"
version = "0.1.0"
edition = "2024"
authors = ["Your Name <your.email@example.com>"]
description = "Unified performance analysis module for the game engine"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
wgpu = { workspace = true }
crossbeam-channel = "0.5.15"
crossbeam = "0.8"
log = "0.4.29"
num-traits = "0.2"
tracing = "0.1.44"
glam = { workspace = true, features = ["bytemuck", "serde"] }
thiserror = "2.0"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

# Dev dependency on workspace crate to make doc tests and examples resolve the engine types
game_engine = { path = "../game_engine", package = "game_engine" }
