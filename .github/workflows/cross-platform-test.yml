name: Cross-Platform Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # 每天运行一次跨平台测试
    - cron: '0 2 * * *'

jobs:
  test:
    name: Test on ${{ matrix.os }} (${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
          - wasm32-unknown-unknown
        exclude:
          # 排除不兼容的组合
          - os: ubuntu-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-apple-darwin
        include:
          # 为每个平台添加原生目标
          - os: ubuntu-latest
            rust: stable
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            rust: stable
            target: x86_64-apple-darwin
          - os: windows-latest
            rust: stable
            target: x86_64-pc-windows-msvc
          # WASM目标在所有平台上都可以测试
          - os: ubuntu-latest
            rust: stable
            target: wasm32-unknown-unknown
          - os: macos-latest
            rust: stable
            target: wasm32-unknown-unknown
          - os: windows-latest
            rust: stable
            target: wasm32-unknown-unknown

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          override: true
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Install WASM target (if needed)
        if: matrix.target == 'wasm32-unknown-unknown'
        run: rustup target add wasm32-unknown-unknown

      - name: Check formatting
        if: matrix.rust == 'stable' && matrix.target != 'wasm32-unknown-unknown'
        run: cargo fmt --all -- --check

      - name: Run Clippy
        if: matrix.rust == 'stable' && matrix.target != 'wasm32-unknown-unknown'
        run: |
          cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings
        continue-on-error: true

      - name: Build
        run: |
          cargo build --target ${{ matrix.target }} --package game_engine
        continue-on-error: true

      - name: Run tests
        if: matrix.target != 'wasm32-unknown-unknown'
        run: |
          cargo test --target ${{ matrix.target }} --package game_engine --lib
        continue-on-error: true

      - name: Run WASM tests
        if: matrix.target == 'wasm32-unknown-unknown'
        run: |
          # WASM测试需要特殊处理
          cargo test --target ${{ matrix.target }} --package game_engine --lib --no-default-features --features wasm
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/**/*.d
          if-no-files-found: ignore

  test-summary:
    name: Test Summary
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "Cross-platform tests completed. Check individual job results for details."

