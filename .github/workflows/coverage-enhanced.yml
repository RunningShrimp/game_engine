name: Enhanced Coverage Report

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # 每周一运行一次完整覆盖率报告
    - cron: '0 0 * * 1'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================
  # 代码覆盖率
  # ============================================
  coverage:
    name: 代码覆盖率报告
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: 安装 cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-

      - name: 运行测试并生成覆盖率
        run: |
          cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: 生成HTML报告
        run: |
          cargo llvm-cov --all-features --workspace --html --output-dir coverage-html

      - name: 上传覆盖率报告到Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: 上传HTML覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: coverage-html/
          retention-days: 30

      - name: 生成覆盖率摘要
        run: |
          cargo llvm-cov --all-features --workspace --summary-only > coverage-summary.txt
          cat coverage-summary.txt

      - name: 上传覆盖率摘要
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary.txt

      - name: 评论PR覆盖率
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ## 📊 代码覆盖率报告

            ### 覆盖率摘要
            ```
            ${{ github.workspace }}/coverage-summary.txt
            ```

            ### 详细报告
            - 下载HTML报告查看详细覆盖率信息
            - 查看 [Codecov报告](https://codecov.io/gh/${{ github.repository }}/commit/${{ github.sha }})

            ### 覆盖率目标
            - 目标覆盖率: 80%+
            - 当前覆盖率: 查看上方摘要

  # ============================================
  # 覆盖率趋势分析
  # ============================================
  coverage-trend:
    name: 覆盖率趋势分析
    runs-on: ubuntu-latest
    needs: coverage
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 下载覆盖率摘要
        uses: actions/download-artifact@v4
        with:
          name: coverage-summary

      - name: 分析覆盖率趋势
        run: |
          # 解析覆盖率数据
          TOTAL=$(grep -oP 'Total.*\K\d+\.\d+' coverage-summary.txt | head -1 || echo "0")
          echo "总覆盖率: $TOTAL%"
          
          # 检查是否达到目标
          if (( $(echo "$TOTAL < 80" | bc -l) )); then
            echo "⚠️ 覆盖率低于80%目标"
            exit 1
          else
            echo "✅ 覆盖率达标"
          fi

      - name: 生成覆盖率趋势图
        run: |
          # 这里可以集成图表生成工具
          echo "覆盖率趋势分析完成"

