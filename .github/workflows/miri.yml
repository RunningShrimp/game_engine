name: Miri

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  miri:
    name: Run Miri Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
        override: true

    - name: Install Miri
      run: rustup component add miri

    - name: Configure Miri
      run: |
        cat > .mirirc.toml << 'EOF'
        # Miri配置文件
        # 排除FFI相关测试（Miri不支持）

        [diag]
        # 显示详细的诊断信息
        verbose = true

        # 禁用某些检查（仅用于兼容性测试）
        # check_alignment = false
        EOF

    - name: Run Miri on game_engine (exclude FFI)
      run: |
        # 跳过包含FFI的模块
        cargo miri test \
          --package game_engine \
          --exclude bindings \
          --exclude xr \
          --exclude platform/wasm_performance

    - name: Run Miri on game_engine_simd (partial)
      run: |
        # SIMD测试需要特殊处理，部分测试可能失败
        cargo miri test --package game_engine_simd || true

    - name: Run Miri on game_engine_performance (exclude allocators)
      run: |
        # 跳过自定义分配器（Miri有自己的分配器）
        cargo miri test \
          --package game_engine_performance \
          --exclude memory::arena \
          --exclude memory::arena_allocator \
          --exclude memory::bump || true

    - name: Check for specific unsafe patterns
      run: |
        echo "Checking for unsafe without SAFETY comments..."

        # 查找unsafe块但缺少SAFETY注释的情况
        grep -r "unsafe {" --include="*.rs" game_engine/src game_engine_simd/src game_engine_performance/src | \
          while read file; do
            # 检查前3行是否有SAFETY或Safety注释
            line=$(echo "$file" | cut -d: -f1)
            lineno=$(echo "$file" | cut -d: -f2)

            # 获取unsafe前3行
            context=$(sed -n "$((lineno-3)),${lineno}p" "$line")

            # 如果没有SAFETY注释，报告
            if ! echo "$context" | grep -qi "SAFETY\|Safety"; then
              echo "WARNING: unsafe without SAFETY comment at $line:$lineno"
            fi
          done || true

        echo "Check complete. See warnings above."

    - name: Generate Miri report
      if: always()
      run: |
        echo "# Miri Test Report" > miri-report.md
        echo "" >> miri-report.md
        echo "**Date**: $(date)" >> miri-report.md
        echo "**Status**: ${{ job.status }}" >> miri-report.md
        echo "" >> miri-report.md
        echo "## Test Coverage" >> miri-report.md
        echo "- game_engine: Partial (FFI excluded)" >> miri-report.md
        echo "- game_engine_simd: Limited (SIMD intrinsics)" >> miri-report.md
        echo "- game_engine_performance: Limited (custom allocators)" >> miri-report.md
        echo "" >> miri-report.md
        echo "## Known Issues" >> miri-report.md
        echo "1. FFI calls (OpenXR, QuickJS) - Unsupported by Miri" >> miri-report.md
        echo "2. SIMD intrinsics - Partially supported" >> miri-report.md
        echo "3. Custom allocators - Use system allocator in Miri" >> miri-report.md

    - name: Upload Miri report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: miri-report
        path: miri-report.md
