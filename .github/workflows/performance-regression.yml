name: Performance Regression Detection

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  performance-regression:
    name: Detect Performance Regressions
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build project
        run: cargo build --release --package game_engine

      - name: Install jq (for JSON processing)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh

      - name: Check for baseline file
        id: check_baseline
        run: |
          if [ -f "target/performance_baseline.json" ]; then
            echo "baseline_exists=true" >> $GITHUB_OUTPUT
          else
            echo "baseline_exists=false" >> $GITHUB_OUTPUT
            echo "No baseline file found. Will create initial baseline..."
          fi

      - name: Run performance regression detection
        id: detect_regression
        run: |
          # 运行性能回归检测脚本
          ./scripts/performance_regression.sh || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 1 ]; then
              echo "has_regression=true" >> $GITHUB_OUTPUT
              echo "regression_detected=true" >> $GITHUB_OUTPUT
            else
              echo "has_regression=false" >> $GITHUB_OUTPUT
              echo "regression_detected=false" >> $GITHUB_OUTPUT
            fi
            exit $EXIT_CODE
          }
          echo "has_regression=false" >> $GITHUB_OUTPUT
          echo "regression_detected=false" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-regression-report
          path: |
            target/performance_results.json
            target/performance_baseline.json
            target/criterion/**/*.json
          retention-days: 30

      - name: Comment PR with regression results
        if: github.event_name == 'pull_request' && steps.detect_regression.outputs.has_regression == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let body = '## ⚠️ Performance Regression Detected\n\n';
            
            // 读取性能结果
            if (fs.existsSync('target/performance_results.json')) {
              const current = JSON.parse(fs.readFileSync('target/performance_results.json', 'utf8'));
              const baseline = fs.existsSync('target/performance_baseline.json') 
                ? JSON.parse(fs.readFileSync('target/performance_baseline.json', 'utf8'))
                : null;
              
              if (baseline) {
                body += '### Performance Comparison\n\n';
                body += '| Benchmark | Baseline | Current | Change | Status |\n';
                body += '|-----------|----------|---------|--------|--------|\n';
                
                let hasRegression = false;
                for (const [bench, currentTime] of Object.entries(current.benchmarks || {})) {
                  const baselineTime = baseline.benchmarks?.[bench];
                  if (baselineTime && currentTime) {
                    const regression = ((currentTime - baselineTime) / baselineTime) * 100;
                    const status = regression > 20 ? '❌ CRITICAL' :
                                 regression > 10 ? '⚠️ WARNING' : '✅ OK';
                    
                    body += `| ${bench} | ${baselineTime.toFixed(2)}ns | ${currentTime.toFixed(2)}ns | ${regression > 0 ? '+' : ''}${regression.toFixed(1)}% | ${status} |\n`;
                    
                    if (regression > 10) {
                      hasRegression = true;
                    }
                  }
                }
                
                if (hasRegression) {
                  body += '\n⚠️ **Please review and address these performance regressions before merging.**\n';
                }
              } else {
                body += '⚠️ Baseline file not found. Current results saved as new baseline.\n';
              }
            } else {
              body += '⚠️ Performance results file not found.\n';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail if severe regression detected
        if: steps.detect_regression.outputs.has_regression == 'true'
        run: |
          echo "❌ Performance regression detected. Please review the regression report."
          echo "Check the uploaded artifacts for detailed performance comparison."
          exit 1

