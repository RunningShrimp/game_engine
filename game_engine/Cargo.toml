## - 错误诊断
debug-ui = []

## 启用CUDA GPU加速（Windows/Linux only）
##
## 增加的依赖：
## - 无需额外依赖（使用框架实现）
##
## 支持的功能：
## - GPU物理计算加速
## - GPU粒子系统
## - GPU网格蒙皮
##
## 使用场景：
## - 大规模物理模拟
## - 高性能粒子效果
## - 实时骨骼动画计算
##
## 注意：
## - 仅在 Windows/Linux 平台可用
## - 需要 NVIDIA GPU 和 CUDA Toolkit
## - macOS 将自动回退到 CPU 实现
##
## 示例：
## ```bash
## # Windows/Linux: 启用 CUDA 加速
## cargo build --features cuda
##
## # 其他平台: 自动使用 CPU fallback
## cargo build --features cuda  # 仍然可以编译，但使用CPU
## ```
cuda = []

# ============================================================================
# Feature 组合验证
# ============================================================================
#
## 以下feature组合是互斥的（编译时会报错）：
##
## 1. **密钥交换冲突**:
##    - `secure_key_exchange` 与 `insecure_key_exchange` 不能同时启用
##    - 原因：两种实现使用相同的trait，编译时会产生冲突
##
## 如果尝试同时启用，编译时会触发build.rs中的验证逻辑并报错。
##
## 示例错误：
## ```bash
## # ❌ 这会失败
## cargo build --features secure_key_exchange,insecure_key_exchange
##
## # ✅ 正确做法：只选择一种
## cargo build --features secure_key_exchange  # 推荐
## # 或
## cargo build --features insecure_key_exchange  # 仅测试
## ```

[dev-dependencies]
anyhow = "1.0.100"
byteorder = "1.5"
criterion = { version = "0.8.1", features = ["html_reports"] }
proptest = "1.9.0"
tempfile = "3.23"
env_logger = "0.11"

