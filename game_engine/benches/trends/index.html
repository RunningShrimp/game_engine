<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Engine Performance Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .header h1 {
            color: #2d3748;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header .subtitle {
            color: #718096;
            font-size: 16px;
        }

        .last-update {
            margin-top: 15px;
            padding: 10px 15px;
            background: #f7fafc;
            border-radius: 6px;
            font-size: 14px;
            color: #4a5568;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .metric-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        .metric-card h3 {
            font-size: 14px;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }

        .metric-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .metric-value.improved { color: #48bb78; }
        .metric-value.regressed { color: #f56565; }
        .metric-value.stable { color: #ecc94b; }

        .metric-details {
            font-size: 14px;
            color: #4a5568;
            line-height: 1.6;
        }

        .chart-section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .chart-section h2 {
            color: #2d3748;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .chart-container {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            background: #f7fafc;
        }

        .chart-container img {
            width: 100%;
            height: auto;
            border-radius: 6px;
        }

        .chart-title {
            font-size: 14px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .summary-section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-box {
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box.success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
        }

        .stat-box.danger {
            background: linear-gradient(135deg, #f56565 0%, #e53e3e 100%);
            color: white;
        }

        .stat-box.warning {
            background: linear-gradient(135deg, #ecc94b 0%, #d69e2e 100%);
            color: white;
        }

        .stat-box .number {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-box .label {
            font-size: 14px;
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: white;
            font-size: 18px;
        }

        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .refresh-btn {
            background: #4299e1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .refresh-btn:hover {
            background: #3182ce;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .chart-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- Header -->
        <div class="header">
            <h1>🚀 Game Engine Performance Dashboard</h1>
            <p class="subtitle">Real-time performance monitoring and trend analysis</p>
            <div class="last-update">
                Last updated: <span id="last-update">Loading...</span>
                <button class="refresh-btn" onclick="loadData()">Refresh</button>
            </div>
        </div>

        <!-- Summary Stats -->
        <div class="summary-section" id="summary-section" style="display: none;">
            <h2>📊 Performance Summary</h2>
            <div class="summary-stats">
                <div class="stat-box success">
                    <div class="number" id="improved-count">0</div>
                    <div class="label">Improved</div>
                </div>
                <div class="stat-box danger">
                    <div class="number" id="regressed-count">0</div>
                    <div class="label">Regressed</div>
                </div>
                <div class="stat-box warning">
                    <div class="number" id="stable-count">0</div>
                    <div class="label">Stable</div>
                </div>
                <div class="stat-box" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                    <div class="number" id="total-count">0</div>
                    <div class="label">Total Benchmarks</div>
                </div>
            </div>
        </div>

        <!-- Error Message -->
        <div id="error-message" class="error" style="display: none;"></div>

        <!-- Metrics Grid -->
        <div class="metrics-grid" id="metrics-grid">
            <div class="loading">Loading benchmark data...</div>
        </div>

        <!-- Charts Section -->
        <div class="chart-section" id="charts-section" style="display: none;">
            <h2>📈 Performance Trends</h2>
            <div class="chart-grid" id="charts-grid">
                <!-- Charts will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        let benchmarkData = null;
        let baselineData = null;

        async function loadData() {
            try {
                // 加载当前benchmark数据
                const response = await fetch('benchmark_data.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                benchmarkData = await response.json();

                // 更新时间戳
                document.getElementById('last-update').textContent =
                    new Date().toLocaleString();

                // 渲染数据
                renderDashboard();
            } catch (error) {
                console.error('Error loading data:', error);
                showError('Failed to load benchmark data: ' + error.message);
            }
        }

        function renderDashboard() {
            if (!benchmarkData) return;

            // 计算统计
            let improved = 0;
            let regressed = 0;
            let stable = 0;

            const metricsHTML = Object.entries(benchmarkData).map(([name, data]) => {
                const current = data.mean;
                const baseline = data.baseline || current;
                const change = current - baseline;
                const pctChange = baseline > 0 ? (change / baseline) * 100 : 0;

                let status, statusClass;
                if (pctChange < -5) {
                    status = 'Improved';
                    statusClass = 'improved';
                    improved++;
                } else if (pctChange > 5) {
                    status = 'Regressed';
                    statusClass = 'regressed';
                    regressed++;
                } else {
                    status = 'Stable';
                    statusClass = 'stable';
                    stable++;
                }

                const arrow = pctChange < 0 ? '↓' : pctChange > 0 ? '↑' : '→';

                return `
                    <div class="metric-card">
                        <h3>${name}</h3>
                        <div class="metric-value ${statusClass}">
                            ${arrow} ${Math.abs(pctChange).toFixed(1)}%
                        </div>
                        <div class="metric-details">
                            <strong>Current:</strong> ${current.toFixed(2)} ns<br>
                            <strong>Baseline:</strong> ${baseline.toFixed(2)} ns<br>
                            <strong>Status:</strong> ${status}<br>
                            <strong>StdDev:</strong> ±${data.stddev.toFixed(2)} ns
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('metrics-grid').innerHTML = metricsHTML;

            // 更新摘要统计
            document.getElementById('improved-count').textContent = improved;
            document.getElementById('regressed-count').textContent = regressed;
            document.getElementById('stable-count').textContent = stable;
            document.getElementById('total-count').textContent = Object.keys(benchmarkData).length;
            document.getElementById('summary-section').style.display = 'block';

            // 加载图表
            loadCharts();
        }

        async function loadCharts() {
            try {
                // 查找所有趋势图
                const chartPromises = Object.keys(benchmarkData).map(async (name) => {
                    const chartName = name.replace(/\//g, '_');
                    const imagePath = `${chartName}_trend.png`;

                    try {
                        const response = await fetch(imagePath);
                        if (response.ok) {
                            return {
                                name: name,
                                path: imagePath
                            };
                        }
                    } catch (e) {
                        // 图像不存在，跳过
                    }
                    return null;
                });

                const charts = (await Promise.all(chartPromises)).filter(c => c !== null);

                if (charts.length > 0) {
                    const chartsHTML = charts.map(chart => `
                        <div class="chart-container">
                            <div class="chart-title">${chart.name}</div>
                            <img src="${chart.path}" alt="${chart.name} trend"
                                 onerror="this.parentElement.style.display='none'">
                        </div>
                    `).join('');

                    document.getElementById('charts-grid').innerHTML = chartsHTML;
                    document.getElementById('charts-section').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading charts:', error);
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('metrics-grid').innerHTML = '';
        }

        // 页面加载时自动加载数据
        window.addEventListener('DOMContentLoaded', () => {
            loadData();

            // 每5分钟自动刷新
            setInterval(loadData, 5 * 60 * 1000);
        });
    </script>
</body>
</html>
