# Pre-commit hooks for game engine project
# Install: pip3 install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # ============================================
  # Rust format check
  # ============================================
  - repo: local
    hooks:
      - id: rust-fmt
        name: Rust Format Check
        entry: cargo fmt --all -- --
        language: system
        files: \.rs$
        args: ['--check', '--verbose']
        pass_filenames: false

  # ============================================
  # Clippy lints
  # ============================================
  - repo: local
    hooks:
      - id: rust-clippy
        name: Clippy Linting
        entry: cargo clippy --workspace --all-targets --
        language: system
        files: \.rs$
        args: ['-D', 'warnings', '-W', 'clippy::all']
        pass_filenames: false

  # ============================================
  # Rust tests
  # ============================================
  - repo: local
    hooks:
      - id: rust-test
        name: Run Rust Tests
        entry: cargo test --workspace --lib --quiet
        language: system
        files: \.rs$
        pass_filenames: false

  # ============================================
  # Documentation check
  # ============================================
  - repo: local
    hooks:
      - id: rust-doc
        name: Check Documentation
        entry: cargo doc --workspace --no-deps --document-private-items
        language: system
        files: \.rs$
        pass_filenames: false

  # ============================================
  # TOML format check
  # ============================================
  - repo: local
    hooks:
      - id: cargo-toml-fmt
        name: Format Cargo.toml
        entry: cargo-toml-fmt
        language: system
        files: (Cargo\.toml|Cargo\.lock)$

  # ============================================
  # YAML format check
  # ============================================
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.12.0
    hooks:
      - id: pretty-format-yaml
        args: ['--autofix', '--indent', '2']
        files: \.(yaml|yml)$

  # ============================================
  # Markdown lint
  # ============================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: ['--fix']
        files: \.(md|markdown)$

  # ============================================
  # General file checks
  # ============================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  # ============================================
  # Security checks
  # ============================================
  - repo: local
    hooks:
      - id: cargo-audit
        name: Security Audit
        entry: cargo audit
        language: system
        files: (Cargo\.toml|Cargo\.lock)$
        pass_filenames: false

# Configuration options
default_stages: [pre-commit]
fail_fast: false
