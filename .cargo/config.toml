[build]
# 启用并行编译
jobs = 4

[profile.dev]
# 开发构建优化
opt-level = 0
debug = true
split-debuginfo = "unpacked"

[profile.test]
# 测试构建优化
opt-level = 1
debug = true

[profile.bench]
# 基准测试优化
inherits = "release"
debug = true

[profile.release]
# 发布构建优化
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Netlify测试覆盖率配置
[target.'cfg(not(windows))']
llvm-flags = "-C instrument-coverage"
