# Clippy配置
# 用于代码质量检查

# 允许的unwrap使用（需要逐步减少）
# 关键路径应避免使用unwrap()
# 测试代码中的unwrap()可以接受

# 警告unwrap使用，但不强制禁止（允许列表方式）
# 可以通过 #[allow(clippy::unwrap_used)] 来允许特定情况

# 禁止在关键路径使用unwrap（通过代码审查确保）
# 建议使用 Result 类型和 ? 操作符进行错误处理

# 其他有用的lint规则
warn(clippy::expect_used)  # 建议使用expect()时提供清晰的错误消息
warn(clippy::panic)        # 警告panic使用
warn(clippy::unwrap_used)  # 警告unwrap使用

# 允许测试代码中的unwrap
# 测试代码通常可以使用unwrap，因为测试失败本身就是一种错误报告
