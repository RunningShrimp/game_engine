# Game Engine Documentation
# 游戏引擎文档站点配置

[book]
title = "Game Engine Documentation"
description = "高性能跨平台游戏引擎 - 完整开发文档"
authors = ["Game Engine Team"]
language = "zh"
multilingual = false
src = "."

[build]
build-dir = "book"
create-missing = false

[preprocessor.index]

[preprocessor.links]
# Render #links as HTML links (for cross-references)

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
smart-punctuation = true
mathjax-support = false
# Google Analytics
# google-analytics-analytics-id = "G-XXXXXXXXXX"
# Additional CSS
additional-css = ["theme/css/style.css"]
# Additional JS
additional-js = ["theme/js/custom.js"]

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 2
copy-js = true

[output.html.print]
enable = true
page-break = true

[output.html.fold]
enable = true
level = 0
