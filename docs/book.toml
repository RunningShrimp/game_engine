[book]
title = "Game Engine Documentation"
authors = ["Game Engine Team"]
language = "en"
multilingual = false
src = "."

[build]
build-dir = "book"
create-missing = false
use-default-preprocessors = true
extra-page-list = true

[preprocessor.links]
# 渲染时的链接检查

[preprocessor.toc]
# 目录生成
marker = "[[toc]]"
max-level = 3

[preprocessor.mermaid]
# Mermaid图表支持
command = "mdbook-mermaid"

[output.html]
# HTML输出配置
default-theme = "ayu"
preferred-dark-theme = "ayu"
curly-quotes = true
mathjax-support = true
copy-fonts = true
no-section-label = false
search = true
git-repository-url = "https://github.com/yourusername/game_engine"
edit-url-template = "https://github.com/yourusername/game_engine/edit/main/docs/{path}"

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand-description-title = true
snippet-length = 30

[output.html.code]
# 代码块配置
hard-wrap-line-lengths = false

[output.html.print]
enable = true
page-break = true

[output.linkcheck]
# 链接检查配置
follow-web-links = true
exclude = [ 'facebook\\.com', 'twitter\\.com' ]
warning-policy = "warn"

# 主题配置
[output.html.theme]
git-repository-icon = "fa-github"
edit-url-icon = "fa-edit"

[output.html.theme.palette]
# 颜色主题 - Light mode
[output.html.theme.palette.light]
background = "#ffffff"
foreground = "#1e1e1e"
primary = "#1e88e5"
primary-foreground = "#ffffff"

[output.html.theme.palette.light.content]
background = "#ffffff"
foreground = "#1e1e1e"
code-block = "#f5f5f5"

[output.html.theme.palette.light.alert]
background = "#fff3cd"
foreground = "#856404"

[output.html.theme.palette.light.info]
background = "#d1ecf1"
foreground = "#0c5460"

[output.html.theme.palette.light.success]
background = "#d4edda"
foreground = "#155724"

[output.html.theme.palette.light.warning]
background = "#f8d7da"
foreground = "#721c24"

# 颜色主题 - Dark mode
[output.html.theme.palette.dark]
background = "#1e1e1e"
foreground = "#e0e0e0"
primary = "#42a5f5"
primary-foreground = "#ffffff"

[output.html.theme.palette.dark.content]
background = "#2d2d2d"
foreground = "#e0e0e0"
code-block = "#1e1e1e"

[output.html.theme.palette.dark.alert]
background = "#664d03"
foreground = "#ffecb5"

[output.html.theme.palette.dark.info]
background = "#053c4e"
foreground = "#b6ebf3"

[output.html.theme.palette.dark.success]
background = "#0a3622"
foreground = "#b7e4c7"

[output.html.theme.palette.dark.warning]
background = "#58151c"
foreground = "#f1aeb5"
