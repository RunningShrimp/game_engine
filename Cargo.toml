[workspace]
members = [
    "game_engine",
    "game_engine_hardware",
    "game_engine_performance",
    "game_engine_profiling",
    "game_engine_simd",
    "game_engine_common"
]

resolver = "3"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0"
log = "0.4.29"
tracing = "0.1.44"
bevy_ecs = "0.17"
glam = { version = "0.30", features = ["serde"] }
tokio = { version = "1.48", features = ["full"] }
parking_lot = "0.12.5"
wgpu = "27.0.1"
futures = "0.3.31"
flate2 = { version = "1.1.5", default-features = false, features = ["rust_backend"] }
uuid = { version = "1.19", features = ["v4"] }
