[package]
name = "fps_demo"
version = "0.1.0"
edition = "2024"
authors = ["Game Engine Team"]
description = "3D FPS Demo - Demonstrating C# scripting capabilities"

[dependencies]
game_engine = { path = "../../../", features = ["csharp", "physics", "navmesh", "audio"] }
log = "0.4"
env_logger = "0.11"

[features]
default = ["csharp", "physics", "navmesh", "audio"]
csharp = ["game_engine/csharp"]
physics = ["game_engine/physics"]
navmesh = ["game_engine/physics"]
audio = ["game_engine/physics"]

[[bin]]
name = "fps_demo"
path = "src/main.rs"
